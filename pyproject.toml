[project]
name = "gg4"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "joblib>=1.5.3",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "optuna>=4.9.0",
    "pandas>=3.0.3",
    "ruff>=0.15.16",
    "scipy>=1.17.1",
    "torch>=2.12.0",
    "tqdm>=4.68.2",
    "ty>=0.0.46",
]

[tool.ruff]
exclude = ["provided"]

[tool.ty.src]
exclude = ["provided"]

# Notebooks add their own directory, notebooks/shared, sibling notebook dirs,
# and provided/ to sys.path at runtime. ty cannot see those runtime insertions,
# so the import search paths are declared here for static resolution.
[tool.ty.environment]
extra-paths = [
    "notebooks/shared",
    "provided",
    "notebooks/bode",
    "notebooks/cartesian_control_ablation_band_scale",
    "notebooks/cartesian_control_ablation_blend",
    "notebooks/cartesian_control_ablation_control_mode",
    "notebooks/cartesian_control_ablation_elbow",
    "notebooks/cartesian_control_constrained_heatmap",
    "notebooks/cartesian_control_effort",
    "notebooks/cartesian_control_errors",
    "notebooks/cartesian_control_heatmap",
    "notebooks/cartesian_control_pipeline_robustness",
    "notebooks/cartesian_control_robustness",
    "notebooks/cartesian_control_sweep",
    "notebooks/cartesian_control_trajectory",
    "notebooks/freq_map",
    "notebooks/gain_matrix",
    "notebooks/id",
    "notebooks/latent_dim",
    "notebooks/muscle_selection_freq_sweep",
    "notebooks/neural_correlates",
    "notebooks/obs_reconstruction",
    "notebooks/spectral_control",
    "notebooks/spectral_control_metrics",
]
